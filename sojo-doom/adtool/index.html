<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOM poster editor</title>
<link rel="stylesheet" href="adtool.css">
</head>
<body>
<main>
  <div id="stage"><canvas id="cv" width="320" height="320" aria-label="Poster pixels"></canvas></div>
  <div id="side">
    <p id="hint">Your image as a DOOM wall poster. Tap a color, then paint cells.</p>
    <div id="pal" role="listbox" aria-label="Palette"></div>
    <div id="sizes"></div>
  </div>
</main>
<script src="adtool.js"></script>
</body>
</html>
